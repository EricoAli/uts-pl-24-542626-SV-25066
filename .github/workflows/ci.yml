name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, pdo_sqlite, bcmath, fileinfo, openssl, json
          coverage: none

      - name: Prepare SQLite Database & Environment File
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Ensure Application Key
        run: |
          if [ -z "$APP_KEY" ]; then
            echo "APP_KEY secret not found, generating application key..."
            php artisan key:generate --force
            GENERATED_KEY=$(grep '^APP_KEY=' .env | cut -d '=' -f 2-)
            echo "APP_KEY=$GENERATED_KEY" >> "$GITHUB_ENV"
          else
            echo "Using APP_KEY from repository secrets..."
            sed -i "s|^APP_KEY=.*|APP_KEY=$APP_KEY|" .env
          fi

      - name: Run Feature Tests
        run: |
          php artisan test --colors=never --display-errors --display-warnings --display-deprecations 2>&1 | tee test_results.log || {
            ERROR_MSG=$(tail -n 25 test_results.log | tr '\n' ' ' | sed 's/"/\\"/g')
            echo "::error title=PHPUnit Failure::$ERROR_MSG"
            echo "## ❌ Backend Test Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test_results.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

  deploy:
    name: Build & Push Docker Images to GHCR
    needs: [test-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Konversi nama repository ke lowercase untuk kompatibilitas GHCR (Soal 4c)
      - name: Convert Repository Name to Lowercase
        id: repo-name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${REPO_LOWER}" >> "$GITHUB_ENV"
          echo "Lowercase repository image prefix: ghcr.io/${REPO_LOWER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build dan Push image Backend (hanya dengan tag SHA commit)
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}

      # Build dan Push image Frontend (hanya dengan tag SHA commit)
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api
